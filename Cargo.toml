[workspace]
members = ["fastgmad-lib", "fastgmad-bin"]
resolver = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false
incremental = false

[profile.dev]
opt-level = 0
debug = false
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "off"
panic = "abort"
incremental = true
codegen-units = 256
