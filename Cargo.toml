[workspace]
members = ["fastgmad-lib", "fastgmad-bin"]
resolver = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = false
debug-assertions = false
overflow-checks = false
rpath = false

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256
lto = false
panic = "unwind"
