[package]
name = "fastgmad"
version = "0.5.0"
edition = "2024"
authors = ["William Venner, Mitra-88"]
license = "MIT OR Apache-2.0"
description = "Fast gmad implementation"
repository = "https://github.com/Mitra-88/fastgmad"

[features]
binary = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
memchr = "2.8.3"
log = "0.4.34"
thiserror = "2.0.21"